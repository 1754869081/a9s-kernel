# Build the sdm660-mainline kernel (arm64) for the Samsung Galaxy A9s
# (SM-A9200, codename a9y18qltechn, Snapdragon 660) pure-Linux port.
#
# What this does: cross-compiles the kernel on a standard GitHub-hosted
# Ubuntu 24.04 runner and uploads the compiled artifacts (Image, Image.gz,
# DTBs, modules, .config). It proves the toolchain + source + defconfig
# build cleanly. It does NOT produce a flashable phone image: there is no
# a9y18qltechn device tree in mainline yet, so no DTB in this build matches
# the A9s. See README.md.
#
# Toolchain choice: upstream's own CI builds natively on aarch64 self-hosted
# runners with plain `make`. GitHub-hosted runners are x86_64, so this
# workflow cross-compiles with gcc-aarch64-linux-gnu (Ubuntu 24.04, GCC 13),
# which is the standard documented way to build an arm64 kernel on x86_64.
name: Build sdm660 kernel (A9s)

on:
  # Runs automatically when the workflow or build script changes.
  push:
    paths:
      - ".github/workflows/build-kernel.yml"
      - "build.sh"
  # ... and manually from the Actions tab (recommended first run).
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch of sdm660-mainline/linux to build"
        required: true
        default: "qcom-sdm660-7.2.y"
      defconfig:
        description: "Defconfig in arch/arm64/configs/"
        required: true
        default: "sdm660_defconfig"

env:
  KERNEL_BRANCH: ${{ inputs.kernel_branch || 'qcom-sdm660-7.2.y' }}
  KERNEL_DEFCONFIG: ${{ inputs.defconfig || 'sdm660_defconfig' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out this repo (workflow + build script)
        uses: actions/checkout@v4

      - name: Free disk space (kernel builds are big)
        run: |
          df -h
          # Standard large pre-installed components, safe to remove on a
          # build-only runner. Do NOT remove /opt/hostedtoolcache (the
          # actions themselves run on the node runtime stored there).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install cross toolchain and kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            cpio xz-utils kmod rsync

      - name: Clone kernel source (shallow, one branch)
        run: |
          git clone --depth 1 --single-branch --branch "$KERNEL_BRANCH" \
            https://github.com/sdm660-mainline/linux.git linux
          cd linux
          echo "HEAD: $(git rev-parse HEAD)"
          git log -1 --format='%H %ci %s'

      - name: Build kernel (Image, modules, DTBs)
        run: bash build.sh
        env:
          KERNEL_DIR: ${{ github.workspace }}/linux
          DEFCONFIG: ${{ env.KERNEL_DEFCONFIG }}
          OUT_DIR: ${{ github.workspace }}/out

      - name: Show artifacts
        run: |
          du -sh out/*
          file out/Image
          ls out/dtbs/ | head -30

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a9s-kernel-build
          path: out/
          if-no-files-found: error
          retention-days: 30
