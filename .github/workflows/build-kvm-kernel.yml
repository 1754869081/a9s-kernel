# Build the KVM test kernel for the Samsung Galaxy A9s
# (SM-A9200, codename a9y18qltechn, Snapdragon 660) — downstream 4.4.205.
#
# What this does: cross-compiles the Samsung downstream kernel (riarumoda's
# kernel_samsung_a9y18qlte, based on Samsung Open Source code) using the
# phone's own stock config with KVM enabled, and uploads the built kernel
# (Image / Image.gz), System.map, final .config, modules and the Samsung
# DTBs. It does NOT produce a flashable image: the parent packs boot.img
# from Image.gz + the recovered ramdisk/DTBs, and the user flashes it
# himself via Odin, then checks whether /dev/kvm appears.
#
# Toolchain choice: GCC 4.9 (aarch64-linux-android-4.9) from Android NDK r17c,
# downloaded from dl.google.com. This is the SAME compiler generation Samsung
# used to build the stock 4.4.205 kernel. We first tried ARM GCC 9.2 (runs
# #1-#6): every run died on a different warning class that GCC 9 emits on
# 2018-era code (misleading-indentation, duplicate-decl-specifier,
# bool-compare, ...) and that the tree's gcc-wrapper.py treats as a fatal
# error — a new one each run, because the build stops at the first error.
# GCC 4.9 never emits those warning classes, so it ends the whack-a-mole.
# (Linaro's 4.9 tarballs are no longer hosted; NDK r17c is the last NDK
# with GCC and its 676 MB zip is the smallest reliable source.)
# Only the aarch64 4.9 toolchain subtree is extracted from the NDK zip.
# Fallback (if this toolchain download or the build fails): Ubuntu 24.04's
# gcc-aarch64-linux-gnu (GCC 13) with KBUILD_CFLAGS="-fcommon" added to the
# make invocations in build-kvm.sh. See README.md.
#
# SIGPIPE lesson from the mainline build (run #2): never pipe `ls` into
# `head` under `set -euo pipefail` — head closes the pipe, ls gets SIGPIPE
# and the script dies after a successful build. This workflow avoids
# `ls | head` entirely.
name: Build KVM test kernel (A9s)

on:
  # Runs automatically when the workflow, build script or config changes.
  push:
    paths:
      - ".github/workflows/build-kvm-kernel.yml"
      - "build-kvm.sh"
      - "a9200-kvm.config"
  # ... and manually from the Actions tab (recommended first run).
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/riarumoda/kernel_samsung_a9y18qlte.git
  TOOLCHAIN_URL: https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out this repo (workflow + build script + config)
        uses: actions/checkout@v4

      - name: Free disk space (kernel builds are big)
        run: |
          df -h
          # Standard large pre-installed components, safe to remove on a
          # build-only runner. Do NOT remove /opt/hostedtoolcache (the
          # actions themselves run on the node runtime stored there).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          df -h

      - name: Install kernel build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            device-tree-compiler \
            cpio xz-utils unzip kmod rsync

      - name: Download GCC 4.9 toolchain (Android NDK r17c)
        run: |
          curl -L --fail --retry 3 -o /tmp/ndk-r17c.zip "$TOOLCHAIN_URL"
          # Extract only the aarch64 GCC 4.9 toolchain subtree (the full NDK
          # is ~3 GB extracted; we need just this ~300 MB toolchain).
          unzip -q /tmp/ndk-r17c.zip "android-ndk-r17c/toolchains/aarch64-linux-android-4.9/*" -d "$GITHUB_WORKSPACE/ndk"
          "$GITHUB_WORKSPACE/ndk/android-ndk-r17c/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/aarch64-linux-android-gcc" --version
          rm /tmp/ndk-r17c.zip

      - name: Clone kernel source (shallow)
        run: |
          git clone --depth 1 --single-branch "$KERNEL_REPO" kernel
          cd kernel
          echo "HEAD: $(git rev-parse HEAD)"
          git log -1 --format='%H %ci %s'
          head -4 Makefile

      - name: Build kernel (Image.gz, modules, DTBs)
        run: bash build-kvm.sh
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          CONFIG_FILE: ${{ github.workspace }}/a9200-kvm.config
          TOOLCHAIN_DIR: ${{ github.workspace }}/ndk/android-ndk-r17c/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64
          OUT_DIR: ${{ github.workspace }}/out

      - name: Show artifacts
        run: |
          du -sh out/
          file out/Image out/Image.gz
          ls out/dtbs/
          ls out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a9s-kvm-kernel
          path: out/
          if-no-files-found: error
          retention-days: 30
